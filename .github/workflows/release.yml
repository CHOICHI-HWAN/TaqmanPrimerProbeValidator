name: release

on:
  push:
    tags: ["chichipes-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: scripts/release.sh "${GITHUB_REF_NAME#chichipes-}"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
